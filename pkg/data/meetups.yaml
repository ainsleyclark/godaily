# Go meetups curated list.
#
# Drives the Wednesday community-promo social rotation
# (pkg/services/social/candidates/community.go). The rotation reads each
# group's upcoming events from its public Meetup.com iCal feed
# (https://www.meetup.com/<meetup_group>/events/ical/) and promotes the
# soonest event 3-21 days out, tagging the group's social handles so it
# gets a notification and (often) reshares. A group is promoted at most
# once every 8 weeks, and a group with nothing scheduled is never posted.
#
# Schema:
#   slug:        stable unique id (used in the social-post subject)
#   name:        human display name
#   url:         primary group page (Meetup.com, own site, etc.)
#   meetup_group: Meetup.com group path segment, e.g. "golang-amsterdam" for
#                meetup.com/golang-amsterdam/. Leave "" for groups not on
#                Meetup.com: they have no feed and are never promoted.
#   location:    city / region — short, free text
#   description: one sentence about the group (posts use the event's title)
#   handles:
#     linkedin:
#       slug: company-page-slug, e.g. "london-gophers" → linkedin.com/company/london-gophers
#       urn:  urn:li:organization:<numeric-id>  # enables real inline @-mention; leave "" if unknown
#     bluesky:  full handle, e.g. "golanglondon.bsky.social"
#     mastodon: user@instance
#
# How to find the URN: open the public /company/<slug> page in a logged-in
# browser, view source, and grep for "urn:li:organization:". Without a URN
# the post falls back to a plain URL card (still clickable but not tagged).
#
# Leave any handle field blank ("") when unknown — the rotation falls
# back to a no-mention template variant.
#
# Adding a meetup:
#   1. Append an entry (slug must be unique) and set meetup_group.
#   2. Commit. It is promoted on a Wednesday when it next has an event
#      3-21 days away.
#
# References:
#   https://www.meetup.com/find/?keywords=golang
#   https://go.dev/wiki/Conferences (also lists user groups)

